spring.application.name=backend


# ==========================================
# CONFIGURACIÓN DE LA BASE DE DATOS POSTGRE
# ==========================================
# Puerto dinámico
server.port=${PORT:8080}

# Conexión a Base de Datos mediante Variables de Entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pomodorowar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Clave JWT
jwt.secret=${JWT_SECRET:UG9tb2Rvcm9XYXJTZWNyZXRLZXlQYXJhRWxUb2tlbkJlYXJlckRlVHVURkcyMDI2}

# ==========================================
# CONFIGURACIÓN DE CORREO API REST (BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:tu_clave_api_aqui_para_pruebas}
brevo.sender.email=${BREVO_SENDER_EMAIL:tu_correo_registrado_en_brevo@gmail.com}

#Swagger
springdoc.api-docs.enabled=false